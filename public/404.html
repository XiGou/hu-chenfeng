<!DOCTYPE html>

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,

      display: grid; place-items: center; min-height: 100vh;
    }
    main { max-width: 560px; padding: 2rem; text-align: center; }
    h1 { font-family: Georgia, "Songti SC", serif; font-weight: 500; font-size: 2rem; margin-bottom: 1rem; }
    p { color: var(--fg-soft); margin-bottom: 2rem; }
    a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
    a:hover { border-color: var(--fg); }
  </style>
</head>
