<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 · 未找到 · 户晨风语录</title>
    <meta name="robots" content="noindex" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4efe4;
        font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
        color: #2b2620;
        text-align: center;
        padding: 2rem;
      }
      .seal {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.6rem;
        display: grid;
        place-items: center;
        font-size: 2.2rem;
        color: #f6ece0;
        background: #a63026;
        border-radius: 6px;
        transform: rotate(-3deg);
      }
      h1 { font-size: 2rem; letter-spacing: 0.15em; margin-bottom: 0.8rem; }
      p { color: #6b6153; }
      a {
        display: inline-block;
        margin-top: 1.8rem;
        color: #a63026;
        text-decoration: none;
        border: 1px solid #a63026;
        border-radius: 999px;
        padding: 0.5rem 1.4rem;
      }
      a:hover { background: rgba(166, 48, 38, 0.08); }
    </style>
  </head>
  <body>
    <div>
      <div class="seal">404</div>
      <h1>此页无字</h1>
      <p>所寻之篇，未见于卷中。</p>
      <a href="/">↩ 返回语录</a>
    </div>
  </body>
</html>
