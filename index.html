<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="户晨风直播文字稿精华摘录——从万千场直播中精选的思考片段，安静阅读，边读边听。" />
    <meta name="theme-color" content="#ffffff" />
    <title>户晨风直播文字稿精华摘录 | 户晨风语录精选</title>
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicons/apple.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main/home.js"></script>
    <script>
      // 状态栏缩略图：每次刷新在苹果/特斯拉/山姆之间随机出现
      (function () {
        var logos = ["apple", "tesla", "sam"];
        var pick = logos[Math.floor(Math.random() * logos.length)];
        var link = document.getElementById("favicon");
        if (link) {
          link.setAttribute("href", "./favicons/" + pick + ".svg");
        }
      })();
    </script>
  </body>
</html>
