<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="户晨风 · 展厅 —— 户晨风先生的图像资料集锦，展现直播之外的日常与风采。" />
    <meta name="theme-color" content="#ffffff" />
    <title>户晨风展厅 | 图像资料与人物风采</title>
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicons/apple.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main/gallery.js"></script>
    <script>
      (function () {
        var logos = ["apple", "tesla", "sam"];
        var pick = logos[Math.floor(Math.random() * logos.length)];
        var link = document.getElementById("favicon");
        if (link) {
          link.setAttribute("href", "./favicons/" + pick + ".svg");
        }
      })();
    </script>
  </body>
</html>
