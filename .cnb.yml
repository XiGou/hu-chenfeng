# ==========================================================================
# .cnb.yml — CNB 云原生构建流水线
#
# 用于在 CNB 平台"直接部署"户晨风语录站点。
# 站点基于 Vite + Vue 3 构建，本流水线负责：
#   1. 构建 —— 安装依赖并用 Vite 打包到 dist/
#   2. 公网部署 —— 通过腾讯云 COS 对象存储 + 静态网站托管对外提供服务
#   3. 同步代码 —— 将代码自动推送到 GitHub 同名仓库
#
# 【COS 部署说明】
#   部署到 COS 需要配置以下环境变量（可在 CNB「仓库设置 → 流水线环境变量」
#   或「个人环境变量」中设置，或通过密钥仓库 imports 导入）：
#     COS_SECRET_ID  腾讯云 API 密钥 ID
#     COS_SECRET_KEY 腾讯云 API 密钥 Key
#     COS_BUCKET     存储桶，格式如 `bucket-appid.cos.ap-guangzhou.myqcloud.com`
#     COS_REGION     地域，如 `ap-guangzhou`
#   未配置 COS 凭证时，流水线仅执行「构建校验」，部署步骤自动跳过。
#
# 【GitHub 同步说明】
#   同步代码到 GitHub 需要配置以下环境变量：
#     GITHUB_TOKEN   GitHub Personal Access Token（需 repo 权限，建议用 fine-grained token）
#     GITHUB_REPO    可选，GitHub 目标仓库，如 `owner/repo`；默认推送到同名仓库
#     GITHUB_BRANCH  可选，目标分支，默认 `main`
#   未配置 GITHUB_TOKEN 时，同步步骤自动跳过。
# ==========================================================================

main:
  push:
    - name: 构建并部署站点
      lock:
        key: deploy-static-site
        wait: true
        cancel-in-wait: true
      docker:
        image: node:20
      stages:
        # ---- 构建 ----
        - name: 安装依赖并构建
          script: |
            set -e
            echo "==> 初始化 submodule（HuChenFeng 参考仓库）"
            git submodule update --init --recursive || echo "警告：submodule 初始化失败，跳过（构建不依赖其内容）"
            echo "==> 安装依赖"
            npm ci
            echo "==> Vite 生产构建"
            npm run build
            echo "==> 校验构建产物"
            for f in dist/index.html; do
              [ -f "$f" ] || { echo "缺少构建产物: $f"; exit 1; }
            done
            echo "==> Vite 构建通过 ✔"

        # ---- 公网部署到对象存储（COS），未配置凭证则跳过 ----
        - name: 部署到对象存储
          if: '[ -n "$COS_SECRET_ID" ] && [ -n "$COS_SECRET_KEY" ] && [ -n "$COS_BUCKET" ]'
          script: |
            set -e
            echo "==> 安装 coscmd"
            pip install -q coscmd

            echo "==> 配置 coscmd"
            coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" \
                          -b "$COS_BUCKET" -r "${COS_REGION:-ap-guangzhou}"

            echo "==> 上传静态站点（递归同步，删除远端多余文件）"
            coscmd upload -rs ./dist/ / --delete --yes

            echo "==> 站点已部署。若已开启 COS 静态网站托管，可访问："
            echo "    https://${COS_BUCKET}/index.html"

        # ---- 同步代码到 GitHub，未配置凭证则跳过 ----
        - name: 同步代码到 GitHub
          if: '[ -n "$GITHUB_TOKEN" ]'
          script: |
            set -e
            echo "==> 配置 Git 身份"
            git config --global user.name "${GITHUB_ACTOR:-hu-chenfeng-bot}"
            git config --global user.email "${GITHUB_ACTOR_EMAIL:-bot@users.noreply.github.com}"

            # 目标仓库：默认推送到同名仓库 XiGou/hu-chenfeng，可被 GITHUB_REPO 覆盖
            GH_REPO="${GITHUB_REPO:-XiGou/hu-chenfeng}"

            GH_BRANCH="${GITHUB_BRANCH:-main}"
            echo "==> 推送目标: https://github.com/${GH_REPO} (branch: ${GH_BRANCH})"

            echo "==> 添加 GitHub 远端"
            git remote remove github 2>/dev/null || true
            git remote add github "https://${GITHUB_TOKEN}@github.com/${GH_REPO}.git"

            echo "==> 推送代码到 GitHub"
            git push --force github "HEAD:${GH_BRANCH}" || {
              echo "警告：推送到 GitHub 失败，请检查 GITHUB_TOKEN 权限与仓库地址"
              exit 1
            }
            echo "==> 代码已同步到 GitHub ✔"
