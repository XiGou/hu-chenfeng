# ==========================================================================
# .cnb.yml — CNB 云原生构建流水线
#
# 用于在 CNB 平台"直接部署"户晨风语录站点。
# 站点基于 Vite + Vue 3 构建，本流水线负责：
#   1. 构建 —— 安装依赖并用 Vite 打包到 dist/
#   2. 详情页生成 —— og 卡片 + Vue SSR 预渲染每条「选读」详情页（dist/选读/<id>.html）
#   3. 公网部署 —— 通过腾讯云 COS 对象存储 + 静态网站托管对外提供服务
#
# 【站点地址 SITE_URL】
#   `npm run build` 通过 `process.env.SITE_URL` 读取环境变量，将详情页
#   og:url / og:image / og:audio 在构建期烘成绝对 https
#   （X/Twitter/微信等爬虫不执行 JS，需要绝对地址才能出预览卡片）。
#   建议在各部署平台按其配置方式注入 SITE_URL，而非在本流水线中硬编码：
#   - CNB 流水线：在「仓库设置 → 流水线环境变量」配置 SITE_URL，或在本文件
#     imports 的密钥文件中声明 SITE_URL
#   - GitHub Actions（.github/workflows/deploy.yml）：env 注入
#   - Cloudflare Pages：在 CF 构建设置中配置 SITE_URL 环境变量
#   未配置 SITE_URL 时产物保持域名无关（og meta 走相对路径 + 运行时 location 补齐）。
#   og:url 使用不带 .html 后缀的干净地址，避免 CF 对 .html 走 308 重定向。
#
# 【COS 部署说明】
#   部署到 COS 需要配置以下环境变量（可在 CNB「仓库设置 → 流水线环境变量」
#   或「个人环境变量」中设置，或通过密钥仓库 imports 导入）：
#     COS_SECRET_ID  腾讯云 API 密钥 ID
#     COS_SECRET_KEY 腾讯云 API 密钥 Key
#     COS_BUCKET     存储桶，格式如 `bucket-appid.cos.ap-guangzhou.myqcloud.com`
#     COS_REGION     地域，如 `ap-guangzhou`
#   未配置 COS 凭证时，流水线仅执行「构建校验」，部署步骤自动跳过。
# ==========================================================================

main:
  push:
    - name: 构建并部署站点
      lock:
        key: deploy-static-site
        wait: true
        cancel-in-wait: true
      docker:
        image: node:20
      imports:
        - https://cnb.cool/gotham-xigou/secret-env/-/blob/main/secret-env.yml
      stages:
        # ---- 构建 ----
        - name: 安装依赖并构建
          script: |
            set -e
            echo "==> 初始化 submodule（HuChenFeng 参考仓库）"
            git submodule update --init --recursive || echo "警告：submodule 初始化失败，跳过（构建不依赖其内容）"

            echo "==> 安装 ffmpeg（用于合成 og:image 社交分享卡片图；已取消选读视频合成）"
            echo "    + fonts-noto-cjk（CJK 字体，供 ffmpeg drawtext 渲染中文标题）"
            (apt-get update -qq && apt-get install -y -qq ffmpeg fonts-noto-cjk >/dev/null 2>&1) \
              || echo "警告：ffmpeg / CJK 字体安装失败，跳过卡片生成（其余不受影响）"
            ffmpeg -version >/dev/null 2>&1 && echo "    ffmpeg 就绪 ✔" || echo "    ffmpeg 不可用（跳过卡片）"
            ls /usr/share/fonts/opentype/noto/NotoSansCJK-*.ttc >/dev/null 2>&1 \
              && echo "    CJK 字体就绪 ✔" || echo "    CJK 字体不可用（跳过卡片）"

            echo "==> 安装依赖"
            npm ci

            echo "==> 确认站点绝对地址（供分享页 og/twitter meta 使用）"
            # SITE_URL 由各部署平台环境变量注入（CNB 流水线 env / GitHub Actions env / CF Pages env）。
            # 未配置 SITE_URL 但配了 COS_BUCKET 时，从 COS_BUCKET 推导。
            # 均未配置时产物保持域名无关（相对路径 + 运行时补齐）。
            if [ -n "$SITE_URL" ]; then
              echo "    使用 SITE_URL=$SITE_URL（构建期烘成绝对 https）"
            elif [ -n "$COS_BUCKET" ]; then
              export SITE_URL="https://${COS_BUCKET}"
              echo "    使用 COS_BUCKET 推导 SITE_URL=$SITE_URL"
            else
              echo "    未配置 SITE_URL/COS_BUCKET——og meta 走相对路径，X 爬虫不出预览卡！"
            fi

            echo "==> Vite 生产构建（含详情页 Vue SSR 预渲染）"
            npm run build

            echo "==> 校验构建产物"
            for f in dist/index.html dist/viewpoints.html dist/quotations.html dist/gallery.html; do
              [ -f "$f" ] || { echo "缺少构建产物: $f"; exit 1; }
            done
            echo "==> Vite 构建通过 ✔"

        # ---- 公网部署到对象存储（COS），未配置凭证则跳过 ----
        - name: 部署到对象存储
          if: '[ -n "$COS_SECRET_ID" ] && [ -n "$COS_SECRET_KEY" ] && [ -n "$COS_BUCKET" ]'
          script: |
            set -e
            echo "==> 安装 coscmd"
            pip install -q coscmd

            echo "==> 配置 coscmd"
            coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" \
                          -b "$COS_BUCKET" -r "${COS_REGION:-ap-guangzhou}"

            echo "==> 上传静态站点（递归同步，删除远端多余文件）"
            coscmd upload -rs ./dist/ / --delete --yes

            echo "==> 站点已部署。若已开启 COS 静态网站托管，可访问："
            echo "    https://${COS_BUCKET}/index.html"
